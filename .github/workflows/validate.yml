name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_head:
        description: 'Expected exact commit SHA for an explicit branch validation dispatch'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify explicitly dispatched head
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          ACTUAL_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'workflow_dispatch expected_head must be a full lowercase commit SHA.' >&2
            exit 1
          fi
          if [[ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]]; then
            echo "workflow_dispatch resolved $ACTUAL_HEAD, expected $EXPECTED_HEAD." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the retained game snapshot and wiki build
        run: npm run check:snapshot
